name: Generate Profile Assets

# Generates the contribution snake + GitHub stats cards, pushes them to the
# `output` branch. The README references them via raw.githubusercontent.com
# (China-accessible, rate-limit-free, no external service at view time).

on:
  schedule:
    - cron: "17 2 * * *"        # daily around 02:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-assets.yml'
      - 'scripts/gen-stats.mjs'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # main -> workspace root (gives us scripts/gen-stats.mjs)
      - uses: actions/checkout@v4

      # output branch -> ./out  (so successfully-generated files persist across runs)
      - name: Checkout output branch (or init empty)
        run: |
          if git clone --branch output --depth 1 "https://github.com/${{ github.repository }}" out 2>/dev/null; then
            echo "output branch cloned"
          else
            mkdir -p out
            cd out
            git init -b output
            cd ..
            echo "output branch initialized fresh"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            out/github-contribution-grid-snake.svg
            out/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate stats + top-langs (self-hosted via GitHub API)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: node scripts/gen-stats.mjs

      - name: Fetch streak card
        run: |
          cd out
          if curl --retry 6 --retry-delay 4 --retry-connrefused -fsSL --max-time 30 \
            "https://streak-stats.demolab.com?user=${{ github.repository_owner }}&theme=transparent&hide_border=true&background=FFFFFF00&ring=F7B93E&fire=F7B93E&currStreakLabel=F7B93E&sideLabels=586069&dates=586069" \
            -o streak.svg.tmp; then
            mv streak.svg.tmp streak.svg
          else
            rm -f streak.svg.tmp
            echo "::warning::streak fetch failed (keeping previous version if any)"
          fi

      - name: Commit & push to output branch
        run: |
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" 2>/dev/null \
            || git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -m "chore: update profile assets (stats + snake)" || echo "nothing to commit"
          git push origin output
